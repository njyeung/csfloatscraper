services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cs2market
      POSTGRES_PASSWORD: cs2market
      POSTGRES_DB: cs2market
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cs2market -d cs2market"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

